<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#fcf6e1"/>
  
  <!-- Zebra body -->
  <g transform="translate(350, 100)">
    <!-- Main body -->
    <ellipse cx="150" cy="200" rx="120" ry="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Head -->
    <ellipse cx="50" cy="120" rx="60" ry="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Neck -->
    <ellipse cx="100" cy="160" rx="30" ry="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Legs -->
    <rect x="80" y="260" width="20" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="120" y="260" width="20" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="180" y="260" width="20" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="220" y="260" width="20" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Hooves -->
    <ellipse cx="90" cy="345" rx="15" ry="8" fill="#000000"/>
    <ellipse cx="130" cy="345" rx="15" ry="8" fill="#000000"/>
    <ellipse cx="190" cy="345" rx="15" ry="8" fill="#000000"/>
    <ellipse cx="230" cy="345" rx="15" ry="8" fill="#000000"/>
    
    <!-- Zebra stripes on body -->
    <g fill="#000000">
      <!-- Body stripes -->
      <rect x="70" y="160" width="10" height="120" transform="rotate(15 75 220)"/>
      <rect x="90" y="150" width="10" height="130" transform="rotate(10 95 215)"/>
      <rect x="110" y="145" width="10" height="135" transform="rotate(5 115 212)"/>
      <rect x="130" y="143" width="10" height="137" transform="rotate(0 135 212)"/>
      <rect x="150" y="145" width="10" height="135" transform="rotate(-5 155 212)"/>
      <rect x="170" y="150" width="10" height="130" transform="rotate(-10 175 215)"/>
      <rect x="190" y="160" width="10" height="120" transform="rotate(-15 195 220)"/>
      <rect x="210" y="170" width="10" height="110" transform="rotate(-20 215 225)"/>
      <rect x="230" y="180" width="10" height="100" transform="rotate(-25 235 230)"/>
      
      <!-- Head stripes -->
      <rect x="20" y="100" width="8" height="40" transform="rotate(20 24 120)"/>
      <rect x="35" y="95" width="8" height="50" transform="rotate(15 39 120)"/>
      <rect x="50" y="90" width="8" height="60" transform="rotate(10 54 120)"/>
      <rect x="65" y="95" width="8" height="50" transform="rotate(5 69 120)"/>
      <rect x="80" y="100" width="8" height="40" transform="rotate(-5 84 120)"/>
      <rect x="95" y="105" width="8" height="30" transform="rotate(-10 99 120)"/>
      
      <!-- Neck stripes -->
      <rect x="80" y="140" width="8" height="40" transform="rotate(25 84 160)"/>
      <rect x="95" y="135" width="8" height="50" transform="rotate(15 99 160)"/>
      <rect x="110" y="130" width="8" height="60" transform="rotate(5 114 160)"/>
      <rect x="125" y="135" width="8" height="50" transform="rotate(-5 129 160)"/>
      
      <!-- Leg stripes -->
      <rect x="85" y="270" width="10" height="8"/>
      <rect x="85" y="290" width="10" height="8"/>
      <rect x="85" y="310" width="10" height="8"/>
      <rect x="85" y="330" width="10" height="8"/>
      
      <rect x="125" y="270" width="10" height="8"/>
      <rect x="125" y="290" width="10" height="8"/>
      <rect x="125" y="310" width="10" height="8"/>
      <rect x="125" y="330" width="10" height="8"/>
      
      <rect x="185" y="270" width="10" height="8"/>
      <rect x="185" y="290" width="10" height="8"/>
      <rect x="185" y="310" width="10" height="8"/>
      <rect x="185" y="330" width="10" height="8"/>
      
      <rect x="225" y="270" width="10" height="8"/>
      <rect x="225" y="290" width="10" height="8"/>
      <rect x="225" y="310" width="10" height="8"/>
      <rect x="225" y="330" width="10" height="8"/>
    </g>
    
    <!-- Eyes -->
    <circle cx="35" cy="110" r="8" fill="#000000"/>
    <circle cx="65" cy="110" r="8" fill="#000000"/>
    <circle cx="37" cy="108" r="3" fill="#ffffff"/>
    <circle cx="67" cy="108" r="3" fill="#ffffff"/>
    
    <!-- Nostrils -->
    <circle cx="25" cy="130" r="3" fill="#000000"/>
    <circle cx="35" cy="132" r="3" fill="#000000"/>
    
    <!-- Mane -->
    <g fill="#000000">
      <rect x="45" y="80" width="4" height="25" transform="rotate(-10 47 92)"/>
      <rect x="52" y="78" width="4" height="28" transform="rotate(-5 54 92)"/>
      <rect x="59" y="76" width="4" height="30" transform="rotate(0 61 91)"/>
      <rect x="66" y="78" width="4" height="28" transform="rotate(5 68 92)"/>
      <rect x="73" y="80" width="4" height="25" transform="rotate(10 75 92)"/>
    </g>
    
    <!-- Tail -->
    <path d="M 270 200 Q 300 210 320 240 Q 315 250 310 245 Q 285 220 260 210" fill="#000000"/>
    <rect x="310" y="240" width="3" height="15" transform="rotate(45 311 247)"/>
    <rect x="315" y="245" width="3" height="15" transform="rotate(45 316 252)"/>
    <rect x="320" y="250" width="3" height="15" transform="rotate(45 321 257)"/>
  </g>
  
  <!-- Orange frame border to maintain brand consistency -->
  <rect x="0" y="0" width="1000" height="500" fill="none" stroke="#fc5203" stroke-width="8" rx="8"/>
  
  <!-- Subtle corner accents -->
  <g fill="#fc5203" opacity="0.3">
    <rect x="20" y="20" width="30" height="4" rx="2"/>
    <rect x="20" y="20" width="4" height="30" rx="2"/>
    
    <rect x="950" y="20" width="30" height="4" rx="2"/>
    <rect x="976" y="20" width="4" height="30" rx="2"/>
    
    <rect x="20" y="476" width="30" height="4" rx="2"/>
    <rect x="20" y="450" width="4" height="30" rx="2"/>
    
    <rect x="950" y="476" width="30" height="4" rx="2"/>
    <rect x="976" y="450" width="4" height="30" rx="2"/>
  </g>
  
  <!-- Zebra fun text -->
  <text x="500" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fc5203" text-anchor="middle">🦓 ZEBRA BOARD 🦓</text>
  <text x="500" y="450" font-family="Arial, sans-serif" font-size="18" fill="#fc5203" text-anchor="middle" opacity="0.7">Why not a zebra? Stripes are cool!</text>
</svg>